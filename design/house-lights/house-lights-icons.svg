<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- VoxCoach House Lights icons. 24px grid, 1.6 stroke, round caps. Filled glyphs (play, pause, stop, record) set fill in the symbol. -->
  <symbol id="hl-mark" viewBox="0 0 28 20"><path d="M1.5 15.5c3 0 3.6-11 6.8-11 3 0 2.8 8.6 5.6 8.6 2.2 0 2.5-3.6 4.6-3.6h8" fill="none" stroke-width="2.4"/></symbol>

  <!-- navigation -->
  <symbol id="hl-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></symbol>
  <symbol id="hl-coach" viewBox="0 0 24 24"><path d="M8.5 3v7.5a3.5 3.5 0 0 0 7 0V3"/><path d="M12 14v7"/><path d="M9.5 21h5"/></symbol>
  <symbol id="hl-songs" viewBox="0 0 24 24"><path d="M9.5 17.5V5.5l10-2.2v11.4"/><circle cx="7" cy="17.5" r="2.5"/><circle cx="17" cy="14.7" r="2.5"/></symbol>
  <symbol id="hl-world" viewBox="0 0 24 24"><path d="M3 6.5 9 4.5l6 2 6-2v13l-6 2-6-2-6 2z"/><path d="M9 4.5v13M15 6.5v13"/></symbol>
  <symbol id="hl-you" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/></symbol>
  <symbol id="hl-choir" viewBox="0 0 24 24"><circle cx="6" cy="9.5" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="18" cy="9.5" r="2"/><path d="M2.6 18.5a3.4 3.4 0 0 1 6.8 0"/><path d="M8.6 16a3.4 3.4 0 0 1 6.8 0"/><path d="M14.6 18.5a3.4 3.4 0 0 1 6.8 0"/></symbol>

  <!-- transport (filled) -->
  <symbol id="hl-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6L18.6 12z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="hl-pause" viewBox="0 0 24 24"><rect x="6.8" y="5" width="3.6" height="14" rx=".8" fill="currentColor" stroke="none"/><rect x="13.6" y="5" width="3.6" height="14" rx=".8" fill="currentColor" stroke="none"/></symbol>
  <symbol id="hl-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.4" fill="currentColor" stroke="none"/></symbol>
  <symbol id="hl-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="hl-loop" viewBox="0 0 24 24"><path d="M17 7H8a4 4 0 0 0-4 4v1"/><path d="m14 4 3 3-3 3"/><path d="M7 17h9a4 4 0 0 0 4-4v-1"/><path d="m10 20-3-3 3-3"/></symbol>

  <!-- voice and practice -->
  <symbol id="hl-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></symbol>
  <symbol id="hl-breath" viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3"/><path d="M3 13h15a3 3 0 1 1-3 3"/><path d="M3 17h6"/></symbol>
  <symbol id="hl-vibrato" viewBox="0 0 24 24"><path d="M2 12c1.7-4.6 3.3-4.6 5 0s3.3 4.6 5 0 3.3-4.6 5 0 3.3 4.6 5 0"/></symbol>
  <symbol id="hl-range" viewBox="0 0 24 24"><path d="M12 3.5v17"/><path d="m8 7.5 4-4 4 4"/><path d="m8 16.5 4 4 4-4"/></symbol>
  <symbol id="hl-keys" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M9 13v6M15 13v6"/><rect x="7.6" y="5" width="2.8" height="8" fill="currentColor" stroke="none"/><rect x="13.6" y="5" width="2.8" height="8" fill="currentColor" stroke="none"/></symbol>
  <symbol id="hl-ear" viewBox="0 0 24 24"><path d="M7 9a5 5 0 0 1 10 0c0 3.2-3 4-3 7a3 3 0 0 1-6 0"/><path d="M10 10a2 2 0 0 1 4 0c0 1.5-1.5 2-1.5 3.5"/></symbol>
  <symbol id="hl-metronome" viewBox="0 0 24 24"><path d="M9 3h6l4 18H5z"/><path d="m12 15 5-9"/><path d="M7 17.5h10"/></symbol>
  <symbol id="hl-headphones" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></symbol>
  <symbol id="hl-steps" viewBox="0 0 24 24"><path d="M4 19h4v-4h4v-4h4V7h4"/></symbol>
  <symbol id="hl-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-5 3 10 2-5h7"/></symbol>

  <!-- songs and analysis -->
  <symbol id="hl-score" viewBox="0 0 24 24"><path d="M3 6h18M3 9.5h18M3 13h18M3 16.5h18"/><circle cx="9" cy="16.5" r="2.1" fill="currentColor" stroke="none"/><path d="M11 16.3V4.5"/></symbol>
  <symbol id="hl-xray" viewBox="0 0 24 24"><path d="M3 6h7M13 6h8M3 10h4M10 10h11M3 14h10M16 14h5M3 18h6M12 18h9"/></symbol>
  <symbol id="hl-zoom" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2"/><path d="m15.2 15.2 5.3 5.3"/><path d="M8 10.5h5M10.5 8v5"/></symbol>

  <!-- progress and identity -->
  <symbol id="hl-chart" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16.5v-4M12 16.5v-8M17 16.5v-6"/></symbol>
  <symbol id="hl-medal" viewBox="0 0 24 24"><circle cx="12" cy="14.5" r="5.5"/><path d="m8.5 3 3.5 6 3.5-6"/></symbol>
  <symbol id="hl-flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5.5 5.5 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2.4 1.3-4 2.8-5 .2 1.9 1 3 2.1 3.3C10.8 9.2 11 6 12 3z"/></symbol>
  <symbol id="hl-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></symbol>
  <symbol id="hl-passport" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/></symbol>
  <symbol id="hl-group" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 19.5a6 6 0 0 1 12 0"/><path d="M16 5.3a3 3 0 0 1 0 5.4"/><path d="M18 14.6a5.6 5.6 0 0 1 3 4.9"/></symbol>

  <!-- interface -->
  <symbol id="hl-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.2"/><path d="M12 7.7v.1"/></symbol>
  <symbol id="hl-chev" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
  <symbol id="hl-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="hl-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="hl-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
</svg>
